<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Praia com mar, areia e palmeira -->
  <!-- Céu -->
  <rect id="area-1" x="0" y="0" width="400" height="150" fill="none" stroke="black" stroke-width="2"/>
  <!-- Sol -->
  <circle id="area-2" cx="340" cy="60" r="40" fill="none" stroke="black" stroke-width="2"/>
  <!-- Mar -->
  <path id="area-3" d="M0,150 Q50,140 100,150 Q150,160 200,150 Q250,140 300,150 Q350,160 400,150 L400,230 L0,230Z" fill="none" stroke="black" stroke-width="2"/>
  <!-- Onda -->
  <path id="area-4" d="M0,200 Q50,190 100,200 Q150,210 200,200 Q250,190 300,200 Q350,210 400,200 L400,230 L0,230Z" fill="none" stroke="black" stroke-width="2"/>
  <!-- Areia -->
  <rect id="area-5" x="0" y="230" width="400" height="170" fill="none" stroke="black" stroke-width="2"/>
  <!-- Tronco palmeira -->
  <path id="area-6" d="M80,380 Q75,320 85,260 Q90,230 80,200" fill="none" stroke="black" stroke-width="4"/>
  <!-- Folha esquerda -->
  <path id="area-7" d="M80,200 Q40,170 20,190 Q50,180 80,200" fill="none" stroke="black" stroke-width="2"/>
  <!-- Folha direita -->
  <path id="area-8" d="M80,200 Q120,170 150,185 Q120,175 80,200" fill="none" stroke="black" stroke-width="2"/>
  <!-- Folha cima -->
  <path id="area-9" d="M80,200 Q75,160 90,150 Q80,165 80,200" fill="none" stroke="black" stroke-width="2"/>
  <!-- Concha -->
  <ellipse id="area-10" cx="250" cy="330" rx="25" ry="15" fill="none" stroke="black" stroke-width="2"/>
  <!-- Estrela do mar -->
  <polygon id="area-11" points="320,300 325,290 335,288 328,280 330,270 320,275 310,270 312,280 305,288 315,290" fill="none" stroke="black" stroke-width="2"/>
  <!-- Nuvem -->
  <ellipse id="area-12" cx="180" cy="45" rx="45" ry="22" fill="none" stroke="black" stroke-width="2"/>
</svg>
