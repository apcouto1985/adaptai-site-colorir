<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Casa simples -->
  <!-- Parede -->
  <rect id="area-1" x="80" y="180" width="240" height="180" fill="none" stroke="black" stroke-width="2"/>
  <!-- Telhado -->
  <polygon id="area-2" points="60,180 200,60 340,180" fill="none" stroke="black" stroke-width="2"/>
  <!-- Porta -->
  <rect id="area-3" x="160" y="270" width="60" height="90" fill="none" stroke="black" stroke-width="2"/>
  <!-- Maçaneta -->
  <circle id="area-4" cx="210" cy="320" r="5" fill="none" stroke="black" stroke-width="2"/>
  <!-- Janela esquerda -->
  <rect id="area-5" x="100" y="220" width="50" height="50" fill="none" stroke="black" stroke-width="2"/>
  <!-- Cruz da janela esquerda -->
  <line x1="125" y1="220" x2="125" y2="270" stroke="black" stroke-width="2" pointer-events="none"/>
  <line x1="100" y1="245" x2="150" y2="245" stroke="black" stroke-width="2" pointer-events="none"/>
  <!-- Janela direita -->
  <rect id="area-6" x="240" y="220" width="50" height="50" fill="none" stroke="black" stroke-width="2"/>
  <!-- Cruz da janela direita -->
  <line x1="265" y1="220" x2="265" y2="270" stroke="black" stroke-width="2" pointer-events="none"/>
  <line x1="240" y1="245" x2="290" y2="245" stroke="black" stroke-width="2" pointer-events="none"/>
  <!-- Chaminé -->
  <rect id="area-7" x="260" y="80" width="30" height="60" fill="none" stroke="black" stroke-width="2"/>
  <!-- Fumaça -->
  <ellipse id="area-8" cx="275" cy="55" rx="20" ry="12" fill="none" stroke="black" stroke-width="2"/>
  <!-- Chão -->
  <rect id="area-9" x="0" y="360" width="400" height="40" fill="none" stroke="black" stroke-width="2"/>
  <!-- Janela do sótão -->
  <circle id="area-10" cx="200" cy="140" r="20" fill="none" stroke="black" stroke-width="2"/>
</svg>
