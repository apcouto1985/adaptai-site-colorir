<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Castelo de princesa com torres pontiagudas -->
  <!-- Torre esquerda -->
  <rect id="area-1" x="50" y="140" width="60" height="220" fill="none" stroke="black" stroke-width="2"/>
  <polygon id="area-2" points="45,140 80,60 115,140" fill="none" stroke="black" stroke-width="2"/>
  <!-- Torre direita -->
  <rect id="area-3" x="290" y="140" width="60" height="220" fill="none" stroke="black" stroke-width="2"/>
  <polygon id="area-4" points="285,140 320,60 355,140" fill="none" stroke="black" stroke-width="2"/>
  <!-- Corpo central -->
  <rect id="area-5" x="110" y="180" width="180" height="180" fill="none" stroke="black" stroke-width="2"/>
  <!-- Torre central -->
  <rect id="area-6" x="165" y="120" width="70" height="65" fill="none" stroke="black" stroke-width="2"/>
  <polygon id="area-7" points="160,120 200,50 240,120" fill="none" stroke="black" stroke-width="2"/>
  <!-- Portão com arco -->
  <path id="area-8" d="M170,360 L170,300 Q200,270 230,300 L230,360Z" fill="none" stroke="black" stroke-width="2"/>
  <!-- Janelas -->
  <circle id="area-9" cx="80" cy="200" r="15" fill="none" stroke="black" stroke-width="2"/>
  <circle id="area-10" cx="320" cy="200" r="15" fill="none" stroke="black" stroke-width="2"/>
  <rect id="area-11" x="140" y="220" width="30" height="40" fill="none" stroke="black" stroke-width="2"/>
  <rect id="area-12" x="230" y="220" width="30" height="40" fill="none" stroke="black" stroke-width="2"/>
  <!-- Bandeirinhas -->
  <polygon id="area-13" points="80,60 100,70 80,80" fill="none" stroke="black" stroke-width="2"/>
  <polygon id="area-14" points="320,60 340,70 320,80" fill="none" stroke="black" stroke-width="2"/>
  <polygon id="area-15" points="200,50 220,60 200,70" fill="none" stroke="black" stroke-width="2"/>
  <!-- Coração na porta -->
  <path id="area-16" d="M192,310 Q192,300 200,295 Q208,300 208,310 L200,320Z" fill="none" stroke="black" stroke-width="2"/>
